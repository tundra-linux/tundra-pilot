<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Tundra default font families. Installed to /etc/fonts/conf.d/60-tundra.conf.

  This file names families and never packages. Fedora and Alpine ship the Noto faces under
  different package names, and the artifact must not care which: fontconfig resolves by
  family, and the package that provides the family is a per-distribution question answered
  in the package list.

  60- puts this after the distribution's own generic aliases (which are 45- and 49-) and
  before the 65- family-specific rules, so it sets the default without overriding a rule
  written for a particular font.

  Noto for all three because it is the one family set both distributions package, it covers
  more scripts than any alternative, and Noto Sans Mono is a real monospace face rather than
  a sans with the widths forced.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>

  <!--
    Subpixel rendering and slight hinting. This is the arrangement that most closely matches
    what a Windows user is coming from; full hinting distorts glyph shapes and none at all
    reads as blurry at the sizes a panel uses.
  -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
