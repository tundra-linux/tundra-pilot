# Privilege escalation for Tundra. Installed to /etc/doas.conf, mode 0400, root:root.
#
# doas rather than sudo because Alpine carries doas in main, which gets about two years of
# support, while sudo is community-only and follows the newest stable branch. The same file
# works on Fedora through the opendoas package, so the artifact does not fork.
#
# Alpine also packages doas-sudo-shim, which provides a `sudo` command that calls doas. It is
# deliberately not used: one name, and documentation that does not have to hedge about which
# one a reader has.
#
# persist keeps the timestamp so a sequence of commands does not prompt per command. keepenv
# is not set: an escalated command gets a clean environment, which is the entire reason to
# prefer this over carrying sudo's defaults.

permit persist :wheel
